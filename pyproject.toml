[project]
name = "yuanwork"
version = "0.1.0"
description = "Local personal work assistant with wiki technology + memory engineering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "YuanWork Contributors" }
]

# Core dependencies
dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",

    # LLM Gateway
    "litellm>=1.40.0",

    # Vector store
    "lancedb>=0.6.0",
    "pyarrow>=15.0.0",

    # Embedding
    "FlagEmbedding>=1.2.0",
    "sentence-transformers>=2.6.0",
    # torch itself comes with FlagEmbedding. On a machine with an
    # NVIDIA card the CUDA build is what makes the embedding fast
    # (ADR-035) - it is not on PyPI's default index, so it is installed
    # separately:
    #   pip install torch --index-url https://download.pytorch.org/whl/cu121
    # Without it the embedding falls back to the CPU, and the reason is
    # written down in the health endpoint.

    # Document parsing
    "pdfplumber>=0.10.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "markdown-it-py>=3.0.0",
    "Pillow>=10.0.0",
    # The benchmark writes its own PDFs - a corpus built with a real
    # writer has the page count and the text volume of a real one.
    "reportlab>=4.0.0",

    # OCR (stage 2) — rapidocr-onnxruntime is a pure-ONNX port of RapidOCR.
    # We prefer it over PaddleOCR because (a) no PaddlePaddle native dep
    # needed, (b) installs in ~50 MB instead of ~2 GB, (c) works on Windows
    # / CPU out of the box. Chinese support is on par with PaddleOCR for
    # printed text (the typical KB use case).
    "rapidocr-onnxruntime>=1.2.0",
    "opencv-python>=4.8.0",

    # Full-text search (Stage 3+) — tantivy replaces the bge-m3 sparse
    # channel because bge-m3 sparse scored 0.0 on pure-number and
    # short-CJK tokens. tantivy gives proper BM25 over jieba-segmented
    # text, so "1280" / "金额" / "INV-2024-001" all match reliably.
    "tantivy>=0.21.0",
    "jieba>=0.42",

    # File watching
    "watchdog>=4.0.0",

    # Utilities
    "PyYAML>=6.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
# The CUDA build of torch. It lives on PyTorch's own index, so it is
# not a plain dependency - the comment says how to install it.
gpu = []
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "ipython>=8.20.0",
]

[project.scripts]
yuanwork = "yuanwork.__main__:main"
yuanwork-bench = "bench.run:main"
yuanwork-accept-workspace = "bench.accept_workspace:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yuanwork"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument (FastAPI uses this)
]

[tool.pytest.ini_options]
# Tests live under src/backend/tests/ (yuanwork package is at src/backend/yuanwork/).
# The src/backend/conftest.py takes care of adding that dir to sys.path.
testpaths = ["src/backend/tests"]
asyncio_mode = "auto"
