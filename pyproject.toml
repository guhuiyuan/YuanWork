[project]
name = "yuanwork"
version = "0.1.0"
description = "Local personal work assistant with wiki technology + memory engineering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "YuanWork Contributors" }
]

# Core dependencies
dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",

    # LLM Gateway
    "litellm>=1.40.0",

    # Vector store
    "lancedb>=0.6.0",
    "pyarrow>=15.0.0",

    # Embedding
    "FlagEmbedding>=1.2.0",
    "sentence-transformers>=2.6.0",

    # Document parsing
    "pdfplumber>=0.10.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "markdown-it-py>=3.0.0",

    # OCR (stage 2)
    "paddleocr>=2.7.0; platform_machine != 'arm'",

    # File watching
    "watchdog>=4.0.0",

    # Utilities
    "PyYAML>=6.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "ipython>=8.20.0",
]

[project.scripts]
yuanwork = "yuanwork.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yuanwork"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument (FastAPI uses this)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
