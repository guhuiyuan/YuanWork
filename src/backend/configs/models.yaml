# YuanWork LLM Models Configuration
# Edit this file to add your API keys and switch models.
#
# To use a model:
# 1. Set the corresponding environment variable (e.g., MINIMAX_API_KEY)
# 2. Reference the model name in the "routing" section below
# 3. Restart YuanWork backend
#
# Currently only MiniMax is active - it is the one model whose key is
# actually set. The other providers below are kept as commented-out
# examples: uncomment the block and add the matching env var to switch
# the routing over to them.

models:
  # MiniMax (Anthropic-compatible API) - the only model in active use.
  minimax-chat:
    provider: anthropic
    api_base: https://api.minimaxi.com/anthropic
    api_key_env: MINIMAX_API_KEY
    model_name: MiniMax-M3

  # --- Other providers, disabled until their API key is set ---

  # OpenAI
  # gpt-4o:
  #   provider: openai
  #   api_key_env: OPENAI_API_KEY
  #   model_name: gpt-4o
  #
  # gpt-4o-mini:
  #   provider: openai
  #   api_key_env: OPENAI_API_KEY
  #   model_name: gpt-4o-mini

  # Anthropic
  # claude-sonnet:
  #   provider: anthropic
  #   api_key_env: ANTHROPIC_API_KEY
  #   model_name: claude-3-5-sonnet-latest

  # DeepSeek (cost-effective for Chinese)
  # deepseek-chat:
  #   provider: openai
  #   api_base: https://api.deepseek.com
  #   api_key_env: DEEPSEEK_API_KEY
  #   model_name: deepseek-chat

  # Local Ollama (fully offline)
  # ollama-llama3:
  #   provider: ollama
  #   api_base: http://localhost:11434
  #   model_name: llama3.1:8b

# Task routing: which model handles which task type
# Everything points at MiniMax-M3 for now. When a second model is enabled,
# split the cheap tasks (understand / extract / ner / reflection /
# conflict_check) onto it and leave `answer` / `wiki_compile` on the
# stronger model.
routing:
  understand: minimax-chat       # Query understanding
  extract: minimax-chat          # Information extraction
  answer: minimax-chat           # Final answer generation
  conflict_check: minimax-chat   # Conflict detection
  reflection: minimax-chat       # Memory reflection
  wiki_compile: minimax-chat     # Wiki page compilation
  ner: minimax-chat              # Named entity recognition
  general: minimax-chat          # Generic chat fallback

budget:
  per_session_max_tokens: 200000
  per_query_max_tokens: 8000
  monthly_cap_usd: 30
  alert_at: 0.8  # Alert when 80% of budget consumed
